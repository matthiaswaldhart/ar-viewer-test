<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ghostly Hauntings</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { --pad: 16px; --bg:#7D838A; }
    * { box-sizing: border-box; }

    @font-face {
      font-family: 'Arizonia';
      src: url('assets/fonts/Arizonia-Regular.woff2') format('woff2'),
           url('assets/fonts/Arizonia-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body { margin:0; padding:var(--pad); font-family: system-ui, sans-serif; background: var(--bg); color:#000; }
    .blur-blob { position: relative; border-radius: 22px; }
    .blur-blob::before {
      content: ""; position: absolute; inset: -10px; border-radius: inherit;
      background: radial-gradient(120% 160% at 50% 0%, rgba(255,255,255,0.7), rgba(230,238,252,0.45) 40%, rgba(210,222,240,0.3) 70%, rgba(200,210,225,0.0) 100%);
      filter: blur(8px); -webkit-filter: blur(8px);
      z-index:0; pointer-events:none;
    }
    .blur-blob>* { position:relative; z-index:1; }

    .header-container { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:var(--pad); padding:18px 24px; }
    h1 { margin:0; font-size:44px; font-weight:400; font-family:'Arizonia', cursive; color:#000; }

    .viewer-wrap { width:100%; height:70vh; max-height:80vh; margin-bottom:var(--pad); overflow:visible; }
    model-viewer { width:100%; height:100%; background:transparent; border-radius:16px; }

    .fab { display:inline-flex; align-items:center; gap:8px; background:transparent; color:#000; padding:10px 14px; border-radius:999px; font-size:14px; border:1px solid #000; cursor:pointer; }

    .info { margin:14px 0; padding:14px; display:grid; gap:6px; }
    .info-row { display:flex; gap:10px; flex-wrap:wrap; }
    .pill { border-radius:999px; padding:6px 10px; font-size:20px; border:1px solid #000; font-family:'Arizonia', cursive; }
    .label { margin-right:6px; font-size:18px; font-family:system-ui,sans-serif; }
    .pill span[id] { font-family:'Arizonia', cursive; font-weight:400; font-size:20px; }

    .qr-panel { display:flex; align-items:center; gap:12px; margin-top:var(--pad); padding:14px 16px; }
    .qr { padding:8px; border-radius:12px; background:#fff; border:1px solid #000; }
    .note { font-size:18px; font-family:system-ui,sans-serif; }

    .scroll-hint { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:5; display:none; align-items:center; justify-content:center; width:44px; height:44px; background:rgba(255,255,255,0.6); border:1px solid #000; border-radius:999px; backdrop-filter:blur(6px); }
    .scroll-hint svg { width:22px; height:22px; }
    @media(max-width:840px){.scroll-hint{display:flex;}}

    .status { position:fixed; right:12px; bottom:12px; z-index:10; padding:10px 12px; border:1px solid #000; background:#fff; color:#000; border-radius:12px; font-size:12px; max-width:60ch; }
  </style>
</head>
<body>
  <div class="header-container blur-blob">
    <h1 id="title">Ghostly Hauntings</h1>
    <button id="btnOpenAR" class="fab">Open in AR</button>
  </div>

  <div class="viewer-wrap blur-blob">
    <model-viewer id="mv"
      src="assets/model.glb"
      ios-src="assets/model.usdz"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      exposure="0.95"
      shadow-intensity="1"
      shadow-softness="0.2"
      environment-image="assets/env/studio.hdr"
      tone-mapping="aces"
      alt="3D model">
    </model-viewer>
  </div>

  <section class="info blur-blob">
    <div class="info-row">
      <span class="pill"><span class="label">Collection:</span> <span id="iCollection">Ghostly Hauntings</span></span>
      <span class="pill"><span class="label">Group:</span> <span id="iGroup">G?</span></span>
      <span class="pill"><span class="label">Look:</span> <span id="iLook">??</span></span>
      <span class="pill"><span class="label">Designer:</span> <span id="iDesigner">Designer Name</span></span>
    </div>
  </section>

  <section class="qr-panel blur-blob">
    <div class="qr"></div>
    <div class="note">Long press the QR code to save an image so you can view the AR look later and share it with your friends :)</div>
  </section>

  <div id="status" class="status">Loading…</div>

  <button id="scrollHint" class="scroll-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const mv=document.getElementById('mv');
    const btnOpenAR=document.getElementById('btnOpenAR');
    const scrollHint=document.getElementById('scrollHint');
    const statusEl=document.getElementById('status');

    function setStatus(msg){statusEl.textContent=msg;}

    async function head(url){try{const r=await fetch(url,{method:'HEAD'});return {url,ok:r.ok,status:r.status,type:r.headers.get('content-type')};}catch(err){return {url,ok:false,status:'network',type:null,err:String(err)};}}

    async function runChecks(){const src=mv.getAttribute('src');const ios=mv.getAttribute('ios-src');const env=mv.getAttribute('environment-image');const parts=await Promise.all([src?head(src):null,ios?head(ios):null,env?head(env):null].filter(Boolean));const lines=parts.map(p=>`${p.url} → ${p.ok?'OK '+p.status:'FAIL '+p.status}${p.type?(' ('+p.type+')'):''}`);setStatus(`Probing files…\n${lines.join('\n')}`);}

    mv.addEventListener('load',()=>setStatus('Model loaded ✓'));
    mv.addEventListener('error',e=>{const msg=(e.detail&&e.detail.message)?e.detail.message:'Unknown error';setStatus('Model failed to load: '+msg+'\n• Check assets/model.glb exists and is under 100MB (no Git LFS).\n• If local, serve via http:// not file://');});

    runChecks();
  </script>
</body>
</html>
